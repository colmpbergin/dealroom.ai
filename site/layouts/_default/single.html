<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} — {{ .Site.Title }}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="{{ .Parent.RelPermalink }}">← Back to snapshot</a>
    <h1>{{ .Title }}</h1>
    {{ if .Date }}<p>{{ .Date.Format "January 2, 2006" }}</p>{{ end }}
  </header>
  <main>
    <article>
      {{ .Content }}
    </article>
  </main>
  <footer>
    <p><a href="{{ .Parent.RelPermalink }}">← Back to snapshot</a> &nbsp;|&nbsp; <a href="/">All Snapshots</a></p>
  </footer>
</body>
</html>
